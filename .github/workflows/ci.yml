name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs: ["31.1"]
        dependencies: [minimum, current]
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Install test, compile, and lint dependencies
        run: |
          emacs -Q --batch \
            --eval "(require 'package)" \
            --eval "(setq package-install-upgrade-built-in t)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-refresh-contents)" \
            --eval "(package-install 'agent-shell)" \
            --eval "(package-install 'magit-section)" \
            --eval "(package-install 'transient)" \
            --eval "(package-install 'package-lint)" \
            --eval "(package-install 'evil)" \
            --eval "(package-install 'org-roam)"
      - name: Select declared minimum direct dependencies
        if: matrix.dependencies == 'minimum'
        run: |
          # The older sources need dependencies that current releases may omit.
          emacs -Q --batch \
            --eval "(require 'package)" \
            --eval "(package-initialize)" \
            --eval "(package-install 'dash)" \
            --eval "(package-install 'compat)"
          mkdir -p "$RUNNER_TEMP/cockpit-minimum/agent-shell" "$RUNNER_TEMP/cockpit-minimum/ui"
          curl -fsSL https://api.github.com/repos/xenodium/agent-shell/tarball/refs/tags/v0.75.2 |
            tar -xz -C "$RUNNER_TEMP/cockpit-minimum/agent-shell" --strip-components=1
          curl -fsSL https://raw.githubusercontent.com/magit/magit/v4.0.0/lisp/magit-section.el \
            -o "$RUNNER_TEMP/cockpit-minimum/ui/magit-section.el"
          curl -fsSL https://raw.githubusercontent.com/magit/transient/v0.7.0/lisp/transient.el \
            -o "$RUNNER_TEMP/cockpit-minimum/ui/transient.el"
          echo "EXTRA_LOAD_PATH=-L $RUNNER_TEMP/cockpit-minimum/agent-shell -L $RUNNER_TEMP/cockpit-minimum/ui" >> "$GITHUB_ENV"
      - name: Run isolated tests
        run: make test integration optional-integration smoke STRAIGHT_BUILD=~/.emacs.d/elpa
      - name: Compile and check documentation
        run: make compile checkdoc STRAIGHT_BUILD=~/.emacs.d/elpa
      - name: Package lint
        run: make lint STRAIGHT_BUILD=~/.emacs.d/elpa
